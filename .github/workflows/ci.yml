name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-node:
    name: Minimum supported Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  check:
    name: Node and Chromium / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked QA dependencies
        run: npm ci
      - name: Remove previous browser evidence
        run: node --input-type=module -e "import { rm } from 'node:fs/promises'; await Promise.all(['browser-validation.json','browser-single.png','browser-multi.png','browser-narrow.png','browser-wiktionary.png','reading-room.png','qa-failure.png'].map(name => rm('docs/' + name, { force:true })));"
      - name: Remove previous locale fixture evidence
        run: node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('test-results/browser-locales', { recursive:true, force:true });"
      - name: Remove previous UI regression evidence
        run: node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('test-results/browser-ui', { recursive:true, force:true });"
      - name: Remove previous dictionary navigation evidence
        run: node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('test-results/browser-navigation', { recursive:true, force:true });"
      - name: Remove previous multilingual card evidence
        run: node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('test-results/browser-multilingual', { recursive:true, force:true });"
      - name: Remove previous request-efficiency evidence
        run: node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('test-results/browser-performance', { recursive:true, force:true });"
      - name: Node regression tests
        run: npm test
      - name: Check extension and scripts
        run: npm run check
      - name: Build the universal Chrome package
        run: npm run package
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx --no-install playwright-core install chromium
      - name: Run actual Chromium extension checks
        run: node tools/browser-qa.js
      - name: Check Chinese regions and English in real Chromium with controlled UI locale inputs
        run: node tools/browser-locale-qa.js
      - name: Check source attribution, reading locale and Traditional Chinese UI
        run: npm run test:browser:ui
      - name: Check dictionary navigation and multilingual link routing
        run: npm run test:browser:navigation
      - name: Check Japanese, Korean, French, German and Spanish Chinese word cards
        run: npm run test:browser:multilingual
      - name: Check repeated lookup reuse, in-flight sharing and error recovery
        run: npm run test:browser:performance
      - name: Upload this platform's universal package
        uses: actions/upload-artifact@v7
        with:
          name: chrome-${{ runner.os }}
          path: dist/*-chrome.zip
          if-no-files-found: error
      - name: Upload this platform's store-layout package
        uses: actions/upload-artifact@v7
        with:
          name: store-${{ runner.os }}
          path: dist/*-store.zip
          if-no-files-found: error
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ runner.os }}
          path: |
            docs/browser-validation.json
            docs/browser-*.png
            docs/reading-room.png
            docs/qa-failure.png
            test-results/browser-locales/**
            test-results/browser-ui/**
            test-results/browser-navigation/**
            test-results/browser-multilingual/**
            test-results/browser-performance/**
          if-no-files-found: warn
          retention-days: 14

  compare-packages:
    name: Compare universal ZIP bytes
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: chrome-*
          path: packages/chrome
      - uses: actions/download-artifact@v8
        with:
          pattern: store-*
          path: packages/store
      - name: Require identical ZIPs for each layout from all three operating systems
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import { join, basename } from 'node:path';
          import { createHash } from 'node:crypto';
          async function files(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            return (await Promise.all(entries.map(entry => entry.isDirectory() ? files(join(dir, entry.name)) : [join(dir, entry.name)]))).flat();
          }
          for (const layout of ['chrome', 'store']) {
            const archives = (await files(`packages/${layout}`)).filter(file => file.endsWith(`-${layout}.zip`)).sort();
            assert.equal(archives.length, 3, `Expected one ${layout} package from each operating system`);
            const baseline = await readFile(archives[0]);
            for (const archive of archives) {
              const bytes = await readFile(archive);
              assert.equal(basename(archive), basename(archives[0]), 'Package names differ across platforms');
              assert.ok(bytes.equals(baseline), `Package bytes differ: ${archive}`);
              console.log(`${createHash('sha256').update(bytes).digest('hex')}  ${archive}`);
            }
          }
          NODE
